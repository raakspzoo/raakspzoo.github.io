
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAAK | Inżynieria • Technologia • Rozwiązania</title>

    <meta name="description"
          content="RAAK sp. z o.o. Niezależne doradztwo inżynierskie i ekspertyzy techniczne w obszarze konstrukcji aluminiowych. 35 lat doświadczenia.">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .plansza {
            display: block;
            width: 100%;
            height: 100vh;
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>

<body>

    <img
        class="plansza"
        src="RAAK_ Inżynieria i nowoczesna architektura.png"
        alt="RAAK - Inżynieria, Technologia, Rozwiązania"
        onerror="if (!this.dataset.retry) {
            this.dataset.retry = '1';
            this.src = 'RAAK_Inżynieria i nowoczesna architektura.png';
        }"
    >

</body>

</html>
